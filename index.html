<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* Color de la página y disposición del título con el GIF. */
      body {
        background: #e8e1cc;
      }

      .encabezado {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 1rem;
        max-width: 1100px;
        margin: auto;
        padding: 0 1rem;
      }

      h1 {
        grid-column: 2;
        margin: 0.67em 0;
        font-size: 3rem;
        text-align: center;
      }

      .encabezado img {
        grid-column: 3;
        justify-self: end;
        width: min(100%, 300px);
        max-height: 170px;
        border-radius: 12px;
        object-fit: contain;
      }

      /* En pantallas pequeñas, título y GIF comparten una fila más estrecha. */
      @media (max-width: 600px) {
        .encabezado {
          grid-template-columns: minmax(0, 1fr) minmax(110px, 40vw);
          gap: 0.5rem;
        }

        h1 {
          grid-column: 1;
          justify-self: center;
          font-size: clamp(1.5rem, 7vw, 2.4rem);
        }

        .encabezado img {
          grid-column: 2;
          width: 100%;
        }
      }

      /* Ancho y lectura de la historia. */
      #historia {
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.7;
        text-align: justify;
        transform-origin: left center;
        transform-style: preserve-3d;
        perspective: 1200px;
      }

      #historia p {
        margin: 0 0 1.25rem;
        hyphens: auto;
      }

      .palabra-animada {
        display: inline-block;
        white-space: nowrap;
      }

      .historia-letra {
        display: inline-block;
      }

      /* Selector de caminos con posiciones izquierda, centro y derecha. */
      #decision {
        margin: 2rem auto;
        text-align: center;
      }

      .selector-interruptor {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 160px minmax(0, 1fr);
        align-items: center;
        gap: 1rem;
        max-width: 760px;
        margin: 1.5rem auto;
      }

      .interruptor-opcion {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .interruptor-opcion--izquierda {
        text-align: right;
      }

      .interruptor-opcion--derecha {
        text-align: left;
      }

      .interruptor-opcion--inactiva {
        opacity: 0.4;
      }

      .interruptor-opcion small {
        line-height: 1.4;
      }

      .interruptor-control {
        position: relative;
        width: 160px;
        height: 56px;
        justify-self: center;
      }

      .interruptor-pista {
        position: absolute;
        inset: 0;
        border: 2px solid #555;
        border-radius: 999px;
        background: #d3c9ad;
      }

      .interruptor-pista::after {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 50%;
        width: 2px;
        background: #777;
        content: "";
      }

      .interruptor-mando {
        position: absolute;
        z-index: 1;
        top: 6px;
        left: 50%;
        width: 40px;
        height: 40px;
        transform: translateX(-50%);
        border: 2px solid #333;
        border-radius: 50%;
        background: #f7f2e5;
        box-shadow: 0 2px 5px rgb(0 0 0 / 25%);
        pointer-events: none;
        transition: left 0.18s ease;
      }

      .interruptor-selector {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: ew-resize;
      }

      .interruptor-selector:focus-visible ~ .interruptor-mando {
        outline: 3px solid #1b5b8a;
        outline-offset: 3px;
      }

      .ayuda-interruptor {
        grid-column: 1 / -1;
        margin: 0;
      }

      button {
        padding: 0.6rem 1rem;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .selector-interruptor {
          grid-template-columns: 1fr 1fr;
          gap: 0.75rem;
        }

        .interruptor-control {
          grid-column: 1 / -1;
          grid-row: 1;
        }

        .interruptor-opcion--izquierda {
          grid-column: 1;
          grid-row: 2;
        }

        .interruptor-opcion--derecha {
          grid-column: 2;
          grid-row: 2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .interruptor-mando {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- El título queda centrado y el GIF a su derecha. -->
    <header class="encabezado">
      <h1>La Gran Torre</h1>
      <img src="uri_ifs___V_i2kzak_VvXfF63j9M-t50JFk_w-IcCDH7FKYoYEOzbg.gif" alt="GIF decorativo">
    </header>

    <!-- main.js inserta aquí los párrafos de cada página. -->
    <main id="historia"></main>

    <!-- main.js crea aquí el interruptor de opciones de la página actual. -->
    <section id="decision">
      <h2>Elige tu camino</h2>
      <div id="opciones"></div>
      <button id="volver" type="button" hidden>Volver a la página anterior</button>
    </section>

    <!-- El motor debe cargarse antes del código de la página. -->
    <script src="aventura.js"></script>
    <script src="anime.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
